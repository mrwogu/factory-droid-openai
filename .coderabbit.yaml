# CodeRabbit AI review configuration.
# Reference: https://docs.coderabbit.ai/reference/configuration

# Review output in English.
language: en

tone_instructions: >-
  Report only verified, actionable findings. Skip hypothetical races,
  speculative error handling, and out-of-scope suggestions. Fail-closed by
  design: never suggest weakening duplicate-key, tool-name, payload-size,
  or trailing-output validation.

reviews:
  profile: chill
  # Approve automatically once all comments are resolved, the latest commit
  # is reviewed, and no pre-merge checks fail.
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  # Generated or recorded artifacts: CI already gates contract drift.
  path_filters:
    - "!openapi.json" # generated by scripts/generate_openapi.py
    - "!CHANGELOG.md" # generated by release-please
    - "!tests/fixtures/**" # recorded model output, not hand-written code
  path_instructions:
    - path: "src/factory_droid_openai/**"
      instructions: >-
        Fail-closed OpenAI bridge. Strict typing, strict mypy, Python 3.11+.
        One concern per module: app.py routes and OpenAI mapping, models.py
        schemas, protocol.py transcript serialization, runner.py Droid SDK
        lifecycle, pool.py session reuse, dialects.py tool-call decoding.
        No blocking I/O on the request path. Preserve OpenAI-compatible
        JSON and SSE shapes. Reject malformed input early; widen acceptance
        only when structure remains verifiable.
    - path: "tests/**"
      instructions: >-
        100% branch coverage required. Use real Droid event-stream fixtures
        instead of mocking the SDK. Avoid wall-clock and narrow-timing-margin
        assertions. Every PAYLOAD_DECODERS entry needs matching
        RecoveryFixture coverage with its exact classification.
    - path: "scripts/**"
      instructions: >-
        Offline replay harness: only bridge_defect fails a run;
        model_behavior is not a code defect. Recordings stay in traces/
        (gitignored); committed fixtures must be sanitized first.
  auto_review:
    enabled: true
    drafts: false
  finishing_touches:
    docstrings:
      # Comments stay minimal; docstring generation would add noise.
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "warning"
      requirements: Conventional Commits format, subject max 70 characters.
  tools:
    # CI runs the locked ruff and mypy versions; CodeRabbit's pinned
    # tool versions would drift and add false positives.
    ruff:
      enabled: false

chat:
  auto_reply: true
