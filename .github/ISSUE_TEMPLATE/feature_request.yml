name: Feature request
description: Propose a focused compatibility or usability improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete limitation or workflow problem.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the requested API or behavior and include an example.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative designs.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: This request fits the OpenAI compatibility bridge scope.
          required: true
        - label: I searched existing issues and discussions.
          required: true
