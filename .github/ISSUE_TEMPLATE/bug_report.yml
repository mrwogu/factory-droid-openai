name: Bug report
description: Report reproducible incorrect behavior.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >
        Do not include API keys, authentication tokens, or private prompt
        content.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the observed behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >-
        Provide the smallest request, configuration, and steps that reproduce
        the issue.
      placeholder: |
        1. Start the bridge with ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: bridge-version
    attributes:
      label: Bridge version
      placeholder: 1.6.12
    validations:
      required: true
  - type: input
    id: droid-version
    attributes:
      label: Droid CLI version
      description: Output from `droid --version`.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output from `python --version`.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: >-
        Model id sent in the request. Tool-call behavior differs per model, so a
        report without it is hard to reproduce.
      placeholder: claude-sonnet-4-5
    validations:
      required: true
  - type: dropdown
    id: response-mode
    attributes:
      label: Response mode
      options:
        - Non-streaming
        - Streaming
        - Both
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove credentials, private paths, and sensitive prompt content.
      render: text
  - type: textarea
    id: recorded-events
    attributes:
      label: Recorded Droid events (optional, most useful)
      description: >-
        A recorded event stream turns this report into an offline regression
        test. Restart the bridge with `FACTORY_DROID_OPENAI_TRACE_PAYLOADS=full`
        and `FACTORY_DROID_OPENAI_TRACE_FILE=/path/trace.jsonl`, reproduce once,
        then paste the `droid.event` lines of that request: `grep '"event":
        "droid.event"' /path/trace.jsonl`. Every line contains the model output
        verbatim, so read it before pasting and remove anything private. See the
        payload tracing section of the README.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials and sensitive data from this report.
          required: true
