name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      # --ignore-scripts so the pinned CLI package's lifecycle hooks cannot
      # run on the runner (githubactions:S6505).
      - name: Install PromptScript
        run: npm install --global --ignore-scripts @promptscript/cli@1.14.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The only step that installs dependencies, and it installs only what
      # the lockfile resolved, as wheels: --frozen keeps the resolution on
      # uv.lock (githubactions:S8544) and --no-build refuses a source
      # distribution, whose build script runs third-party code on the runner
      # (githubactions:S8541). Later steps run their tools straight from the
      # environment instead of re-resolving them.
      - name: Install locked dependencies
        run: |
          uv sync --frozen --all-extras --no-install-project --no-build
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The bridge is the one source build left, so the sync above skips it.
      # Its own wheel is built and installed instead: every install stays a
      # binary, and the suite keeps the package metadata the /version
      # contract asserts.
      - name: Build and install the bridge wheel
        run: |
          uv build --wheel
          python -m pip --python .venv install --only-binary :all: --no-deps dist/factory_droid_openai-*.whl

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test with coverage
        run: pytest --cov=factory_droid_openai --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ./coverage.xml
          use_oidc: true
          version: v11.3.1

      - name: Validate OpenAPI contract
        run: openapi-spec-validator openapi.json

      # Release Please rewrites JSON while updating info.version, so compare
      # re-serialized documents instead of the committed formatting. Dumping
      # keeps the check type-sensitive, where a parsed 0 would equal 0.0.
      - name: Verify OpenAPI contract is regenerated
        run: |
          export COMMITTED_OPENAPI="$RUNNER_TEMP/openapi-committed.json"
          cp openapi.json "$COMMITTED_OPENAPI"
          python scripts/generate_openapi.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          committed = json.loads(
              Path(os.environ["COMMITTED_OPENAPI"]).read_text(encoding="utf-8")
          )
          generated = json.loads(Path("openapi.json").read_text(encoding="utf-8"))
          if json.dumps(committed, sort_keys=True) != json.dumps(generated, sort_keys=True):
              raise SystemExit("Committed OpenAPI document differs from generated schema.")
          PY

      - name: Validate PromptScript targets
        run: |
          prs validate
          prs diff --all --no-color
          prs check

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Same shape as the quality job: dependencies as wheels from the
      # lockfile, the bridge built as its own wheel. The venv's scripts
      # directory goes on PATH for the test step; Windows venvs use Scripts
      # instead of bin, and pwd -W yields the native path form there.
      - name: Install locked dependencies
        shell: bash
        run: |
          uv sync --frozen --all-extras --no-install-project --no-build
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$(pwd -W)/.venv/Scripts" >> "$GITHUB_PATH"
          else
            echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          fi
          uv build --wheel
          python -m pip --python .venv install --only-binary :all: --no-deps dist/factory_droid_openai-*.whl

      - name: Run tests
        run: pytest

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.21"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build distributions
        run: uv build

      - name: Verify wheel installation
        run: |
          python -m venv /tmp/factory-droid-openai-package
          /tmp/factory-droid-openai-package/bin/python -m pip install dist/*.whl
          /tmp/factory-droid-openai-package/bin/python -c "import factory_droid_openai"
          /tmp/factory-droid-openai-package/bin/factory-droid-openai --help

      - name: Smoke test installed HTTP service
        run: |
          set -euo pipefail
          FACTORY_DROID_OPENAI_WORKDIR="$PWD" \
            /tmp/factory-droid-openai-package/bin/factory-droid-openai \
              --host 127.0.0.1 \
              --port 8787 \
              --log-level warning &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          /tmp/factory-droid-openai-package/bin/python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8787"
          for _ in range(50):
              try:
                  with urllib.request.urlopen(f"{base_url}/health") as response:
                      assert json.load(response) == {
                          "status": "ok",
                          "auth": "unknown",
                      }
                  break
              except urllib.error.URLError:
                  time.sleep(0.1)
          else:
              raise RuntimeError("Bridge did not become healthy")

          with urllib.request.urlopen(f"{base_url}/v1/models") as response:
              models = json.load(response)
          assert models["data"][0]["id"] == "factory-droid"

          with urllib.request.urlopen(f"{base_url}/openapi.json") as response:
              schema = json.load(response)
          assert schema["openapi"] == "3.1.0"

          request = urllib.request.Request(
              f"{base_url}/v1/chat/completions",
              data=b'{"model":"factory-droid","messages":[]}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request)
          except urllib.error.HTTPError as error:
              assert error.code == 400
              assert json.load(error)["error"]["type"] == "invalid_request_error"
          else:
              raise AssertionError("Invalid chat request unexpectedly succeeded")
          PY
