name: Docker CI

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@49b3bc877d11eb6cd7dae11e5d4d409465f4f223 # v3.2.1
      - uses: docker/setup-buildx-action@c47758b77c9736a4a036d5d4e9a49c93e2a4b123 # v3.7.1
      - uses: docker/login-action@9780b0c4428bb5f4631a3639a420d1e0ee67c0a4 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@902f8d8d795c6c705b8b7e26d7e625cc8a4d3e17 # v5.7.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,prefix=sha-
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198571cfb76f00 # v6.18.0
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
