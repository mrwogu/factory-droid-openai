[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "factory-droid-openai"
version = "0.1.0"
description = "OpenAI-compatible HTTP bridge for Factory Droid"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "droid-sdk==0.1.2",
  "fastapi>=0.133.1,<1",
  "pydantic>=2.13.4,<3",
  "uvicorn>=0.41.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=2.3.0,<3",
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.15.10,<1",
]

[project.scripts]
factory-droid-openai = "factory_droid_openai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_droid_openai"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF"]
