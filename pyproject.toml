[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "factory-droid-openai"
version = "1.5.0"
description = "Unofficial OpenAI-compatible HTTP bridge for Factory Droid"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "mrwogu" }]
keywords = ["factory", "droid", "openai", "llm", "api", "bridge"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Typing :: Typed",
]
dependencies = [
  "droid-sdk==0.1.2",
  "fastapi>=0.133.1,<1",
  "jsonschema>=4.26.0,<5",
  "pydantic>=2.13.4,<3",
  "uvicorn>=0.41.0,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "mypy>=2.3.0,<3",
  "openai>=2.48.0,<3",
  "openapi-spec-validator>=0.9.0,<1",
  "pytest>=9.0.2,<10",
  "pytest-asyncio>=1.3.0,<2",
  "pytest-cov>=7.1.0,<8",
  "ruff>=0.15.10,<1",
  "types-jsonschema>=4.26.0,<5",
]

[project.urls]
Homepage = "https://github.com/mrwogu/factory-droid-openai"
Documentation = "https://github.com/mrwogu/factory-droid-openai#readme"
Issues = "https://github.com/mrwogu/factory-droid-openai/issues"
Source = "https://github.com/mrwogu/factory-droid-openai"

[project.scripts]
factory-droid-openai = "factory_droid_openai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factory_droid_openai"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "DTZ",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "TCH",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.coverage.run]
branch = true
source = ["factory_droid_openai"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
exclude_lines = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
partial_branches = ["pragma: no branch"]
